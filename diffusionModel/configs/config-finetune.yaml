data:
  data_root: /nfs/turbo/umms-tocho-ns/root_srh_db
  #data_spreadsheet: ../experiments/EXTRA_HQ_paths
  data_spreadsheet: ../experiments/LQ_paths_cleaned
  from_patient_spreadsheet: False
  image_save_path: saved_results_ft
  image_size: 256
diffusion:
  restore_timesteps: 200
  timesteps: 1000
  beta_schedule: cosine # linear, quadratic, cosine, sigmoid
model:
  model_type: VMUNet
  num_classes: 1
  input_channels: 3
  depths: [4, 4, 9, 4]
  depths_decoder: [4, 9, 4, 4]
  drop_path_rate : 0.2
#  微调模型保存的位置
  model_save_path: saved_models_cosine_finetune
  with_time_emb : True
  ckpt: pretrain_150_16-8-2024_model.pt
train:
  sheetname: best_series
  batch_size: 4
  n_epochs: 100
  iters: 625 # defines how many minibatches in each epoch
  lr: 0.000002
  weight_decay: 0.0 # default value
  loss_type: l1 # l1, l2, huber
  metrics_save_path: saved_results_ft
val:
  val_type: cases # cases or random
  val_cases: [NIO_DS_10022] # list of patient NIO_nums
  modulo_save: 2
  modulo_diffusion_save: 50
  val_number: 5 # number of random cases to holdout for validation
  random_seed: 1
  sheetname: validation # validation datasheet from spreadsheet
  metrics_save_path: saved_results_ft
